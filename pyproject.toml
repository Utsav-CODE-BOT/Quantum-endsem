[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quantum-architecture-optimizer"
version = "0.1.0"
description = "Resource-Aware Quantum Neural Architecture Optimization Framework"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "qiskit==1.4.2",
    "qiskit-aer==0.16.4",
    "qiskit-machine-learning==0.8.4",
    "qiskit-algorithms==0.4.0",
    "numpy>=1.23,<3.0",
    "scipy>=1.10,<1.16",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "tabulate>=0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "requests>=2.28.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "smoke: marks smoke tests for quick validation",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
